name: Deploy Frontend to Render

on:
  push:
    branches:
      - master  # replace with your deployment branch if different

jobs:
  deploy-frontend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 22  # or the Node version your frontend uses

      - name: Install frontend dependencies
        run: npm install
        working-directory: frontend  # your frontend folder

      - name: Build frontend
        run: npm run build
        working-directory: frontend

      - name: Deploy to Render
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        run: |
          curl -X POST "https://api.render.com/deploy/srv-d3po9tili9vc73boistg" \
            -H "Authorization: Bearer $RENDER_API_KEY" \
            -H "Accept: application/json"
