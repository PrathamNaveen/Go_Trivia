name: Deploy Frontend to Render

on:
  push:
    branches:
      - master  # change if your deployment branch is different

jobs:
  deploy-frontend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 22  # match your Node version

      - name: Install frontend dependencies
        run: npm install
        working-directory: frontend  # point to your frontend folder

      - name: Build frontend
        run: npm run build
        working-directory: frontend

      - name: Deploy to Render
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: srv-d3po9tili9vc73boistg  # replace with your Render service ID
        run: |
          curl --request POST \
            --url https://api.render.com/v1/services/${{ env.RENDER_SERVICE_ID }}/deploys \
            --header "accept: application/json" \
            --header "authorization: Bearer $RENDER_API_KEY" \
            --header "content-type: application/json" \
            --data '{"clearCache":"do_not_clear"}'
