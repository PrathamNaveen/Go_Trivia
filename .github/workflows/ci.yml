name: CI

on:
    push:
        branches: [master]
    pull_request:
        branches: [master]

jobs:
    build:
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v4

            - name: Set up Go
              uses: actions/setup-go@v4
              with:
                go-version: '1.25.3'

            - name: Build
              run: go build -v ./...

            - name: Install dependencies
              run: go mod tidy

            - name: Build project
              run: go build -v ./...
            
            - name: Run Project
              run: go run main.go
        