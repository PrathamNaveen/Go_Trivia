name: CI

on:
    push:
        branches: [master]
    pull_request:
        branches: [master]

jobs:
    build:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Build Docker file
              run: docker build -t go-trivia-container .

            - name: Run Docker Container
              run: docker run -d -p 8080:8080 --name go-trivia-container go-trivia-container
            - name: Docker Log
              run: docker logs -f go-trivia-container
        